# Self-hosted Cal.diy: one container, one SQLite file. Runs on any machine Docker runs on,
# including a Raspberry Pi (arm64 or armv7).
#
#   docker compose up -d --build
#
# Data lives in the `cal-data` volume; back it up by copying /data/cal.db* while stopped,
# or with `sqlite3 /data/cal.db ".backup /data/backup.db"` while running.

services:
  cal:
    build: .
    image: cal-diy:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/cal.db
    volumes:
      - cal-data:/data

volumes:
  cal-data:
